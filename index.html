<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Satellite Tracker</title>
    <link rel="stylesheet" href="./src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="loading-screen">
        <div class="loader-content">
            <div class="brand">
                <div class="loader-dot"></div>
                <h1>ORBIT LENS</h1>
            </div>
            <div class="loader-status">
                <span id="loading-message">INITIALIZING...</span>
                <span id="progress-text">0%</span>
            </div>
            <div class="progress-container">
                <div id="progress-bar"></div>
            </div>
        </div>
    </div>
    <div id="ui-panel" class="command-panel">
        <div class="panel-header">
            <div class="header-title">
                <h2>ORBIT LENS</h2>
            </div>
        </div>

        <div class="input-group">
            <label for="sat-search">TARGET LOCK</label>
            <input list="sat-list" id="sat-search" autocomplete="off" placeholder="SEARCH SATELLITE...">
            <datalist id="sat-list"></datalist>
        </div>
        
        <div id="offline-banner" style="display: none; background: rgba(220, 38, 38, 0.15); border: 1px solid #dc2626; color: #f87171; padding: 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-align: center; margin-bottom: 12px; letter-spacing: 0.5px;">
            API CONNECTION FAILED: PLEASE TRY AGAIN LATER
        </div>

        <div class="input-group">
            <label for="sat-filter">FILTER</label>
            <select id="sat-filter">
                <option value="ALL">ALL SATELLITES</option>
                <option value="STARLINK">STARLINK CONSTELLATION</option>
                <option value="ONEWEB">ONEWEB CONSTELLATION</option>
                <option value="COMMS">COMMERCIAL COMMS</option>
                <option value="GPS">NAVIGATION (GPS/GLONASS)</option>
                <option value="WEATHER">EARTH OBS & WEATHER</option>
                <option value="STATIONS">SPACE STATIONS</option>
                <option value="OTHER">OTHER / MISCELLANEOUS</option>
            </select>
        </div>

        <div id="data-insights" class="insights-bar" style="display: none;">
            <span class="label">ACTIVE TRACKS</span>
            <span id="insight-count" class="val">0</span>
        </div>

        <div class="divider"></div>

        <div class="telemetry-section">
            <div class="telemetry-title">TARGET: <span id="sat-name" class="active-name">NONE</span></div>
            <div class="telemetry-grid">
                <div class="stat-card">
                    <span class="label">LATITUDE</span>
                    <span id="lat-val" class="val">0.0000°</span>
                </div>
                <div class="stat-card">
                    <span class="label">LONGITUDE</span>
                    <span id="lon-val" class="val">0.0000°</span>
                </div>
                <div class="stat-card">
                    <span class="label">ALTITUDE</span>
                    <span id="alt-val" class="val">0.00 km</span>
                </div>
                <div class="stat-card">
                    <span class="label">VELOCITY</span>
                    <span id="vel-val" class="val">0.00 km/s</span>
                </div>
            </div>
        </div>

        <div class="control-group">
            <button id="cam-toggle" class="cmd-btn">CAMERA LOCK: EARTH</button>
        </div>
    </div>

    <div id="minimap-container" style="display: none;">
        <div class="minimap-header">
            <span>GROUND TRACK 2D</span>
            <button id="expand-map-btn" class="mini-btn" onclick="toggleMap()">EXPAND</button>
        </div>
        <canvas id="minimap" width="1024" height="512"></canvas>
    </div>

    <div id="canvas-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden;"></div>
    
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
