<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real-Time Satellite Tracker</title>
    <link rel="stylesheet" href="./src/style.css">
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-text">INITIALIZING ORBIT LENS... <span id="progress-text">0%</span></div>
      <div class="progress-bar-container">
        <div id="progress-bar"></div>
      </div>
    </div>
    
    <div id="ui-container" style="position: absolute; top: 20px; left: 20px; z-index: 10;">
      <h1 class="title">Orbit Lens Dashboard</h1>
      <div class="data-row">
          <span>TARGET:</span>
          <input type="text" id="sat-search" class="ui-select" placeholder="SEARCH (e.g. STARLINK)" list="sat-list" style="width: 100%; box-sizing: border-box; background: transparent; color: cyan; border: 1px solid cyan; padding: 5px; font-family: monospace;">
          <datalist id="sat-list"></datalist>
      </div>
      <div class="telemetry-panel">
        <div class="data-row">
          <span class="label">SATELLITE:</span>
          <span class="value" id="sat-name">NONE</span>
        </div>
        <div class="data-row">
          <span class="label">LATITUDE:</span>
          <span class="value" id="lat-val">0.0000°</span>
        </div>
        <div class="data-row">
          <span class="label">LONGITUDE:</span>
          <span class="value" id="lon-val">0.0000°</span>
        </div>
        <div class="data-row">
          <span class="label">ALTITUDE:</span>
          <span class="value" id="alt-val">0.00 km</span>
        </div>
        <div class="data-row">
          <span class="label">VELOCITY:</span>
          <span class="value" id="vel-val">0.00 km/s</span>
        </div>
        <button id="cam-toggle" class="ui-button unlocked">CAMERA LOCK: EARTH</button>
      </div>
      
      <div id="minimap-container" style="display: none; margin-top: 15px; border: 1px solid #00ffff; width: 100%; max-width: 360px; position: relative;">
        <button id="expand-map-btn" onclick="window.toggleMap()" style="position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.8); border: 1px solid cyan; color: cyan; cursor: pointer; font-size: 10px; font-weight: bold; z-index: 99999; padding: 4px 8px; pointer-events: auto;">EXPAND</button>
        <canvas id="minimap" width="1024" height="512" style="display: block; width: 100%;"></canvas>
      </div>
    </div>

    <div id="canvas-container" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; overflow: hidden;"></div>
    
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
